<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ねぎちゃん理解度テスト 総合編</title><style>*{box-sizing:border-box}body{background:#101010;color:#eee;font-family:system-ui,sans-serif;margin:0}main{max-width:560px;margin:auto;padding:40px 22px}small{letter-spacing:.2em;color:#aaa}h1{font-size:36px;line-height:1.2}h2{font-size:24px;line-height:1.5}button,input{font:inherit;width:100%;padding:17px;border-radius:8px;margin:7px 0;border:1px solid #555}button{background:#242424;color:white;cursor:pointer;text-align:left}button:hover{border-color:#fff}input{background:#191919;color:white} .primary{background:#eee;color:#111;text-align:center;font-weight:bold}progress{width:100%;accent-color:#ddd;height:8px}p{line-height:1.7;color:#bbb}.result{font-size:64px;font-weight:bold}.review{border-bottom:1px solid #444;padding:14px 0}.ok{color:#9edba9}.ng{color:#f2a1a1}</style><main id="app"></main><script>
const Q=[["私のMBTIは？","ENTP","INTJ",0],["人を好きになる一番のきっかけは？","見た目","尊敬",1],["私が担当している楽器は？","ギター","ベース",0],["仕事で嬉しいのは？","褒められること","頼りにされること",1],["苦手なタイプは？","自分で考えず人に頼る人","何でも自分で決める人",0],["問題が起きたときは？","原因と解決策を考える","まず気持ちに共感してほしい",0],["飼っている猫の名前は？","おもちときなこ","たれかつとおもち",1],["好きな音楽ジャンルは？","メタルコア","パンクロック",0],["私がより大切にしているのは？","人からの評価","自分が納得できること",1],["休日の私は？","夜更かしして長時間寝る","早起きして活動する",0],["苦手な食べ物は？","納豆","オートミール",1],["人に対して腹が立つのは？","能力が足りないとき","努力する姿勢が見えないとき",1],["好きな人に意地悪されると？","可愛いと思う","腹が立つ",0],["私が勤めているのは？","法律事務所","会計事務所",0],["人との付き合い方は？","誰とでも仲良くしたい","付き合う相手は選びたい",1],["好きな笑いのジャンルは？","ブラックユーモア","ほのぼの系",0],["プレゼントでもらうなら？","自分のために選んだもの","とにかく高価なもの",0],["普段飲むコーヒーは？","加糖","無糖",1],["意見が食い違ったときは？","話し合いたい","なるべく触れずにいたい",0],["欲しい車は？","MINI","ジープ ラングラー",1],["仕事をする上で重視するのは？","指示されたことをこなすこと","相手の負担を先回りして減らすこと",1],["好きな人に言われて嬉しいのは？","頼りになる","可愛い",0],["私がより苦手なのは？","暑さ","寒さ",1],["好きな食べ物の味は？","辛くて酸っぱい","甘くてまろやか",0],["謝罪されるときに重視するのは？","何が悪かったか理解していること","すぐに謝ってくれること",0],["人に惹かれる要素は？","知性","運動神経",0],["デートするなら？","気楽に話せるお店","おしゃれな高級店",1],["集団で活動するときの私は？","仕組みを考える側","誰かの指示を待つ側",0],["ChatGPTにつけた名前は？","チャピ助","チャピオ",1],["理想の人間関係は？","お互いに尊敬し支え合える関係","何でも受け入れてもらえる関係",0]];
let i=0,ans=[],name='';const app=document.getElementById('app');function el(t,s,c){let e=document.createElement(t);e.textContent=s;if(c)e.className=c;app.append(e);return e}function start(){app.replaceChildren();el('small','NEGICHAN / PERSONAL QUIZ');el('h1','ねぎちゃん理解度テスト 総合編');el('p','あなたは私のことをどれだけ理解している？ 全30問・二択。');let inp=el('input','');inp.placeholder='ニックネーム（任意）';let b=el('button','START QUIZ →','primary');b.onclick=()=>{name=inp.value;i=0;ans=[];show()}}function show(){app.replaceChildren();el('small','QUESTION '+(i+1)+' / '+Q.length);let p=el('progress','');p.max=Q.length;p.value=i;el('h2',Q[i][0]);[0,1].forEach(a=>{let b=el('button',(a?'B':'A')+'　'+Q[i][a+1]);b.onclick=()=>{ans.push(a);i++;i===Q.length?result():show()}})}function result(){app.replaceChildren();let n=ans.filter((a,j)=>a===Q[j][3]).length;el('small','YOUR RESULT');el('h2',(name?name+' さんの':'あなたの')+'結果');el('div',n+' / '+Q.length,'result');el('p','正答率 '+Math.round(n/Q.length*100)+'%　｜　'+(n===30?'ねぎちゃん博士':n>=24?'かなりの理解者':n>=15?'まだまだ伸びしろあり':'はじめまして？'));let b=el('button','結果をコピー','primary');b.onclick=async()=>{try{await navigator.clipboard.writeText('ねぎちゃん理解度テスト 総合編：'+n+'/'+Q.length+'問正解！');b.textContent='コピーしました'}catch{b.textContent='コピーできませんでした'}};el('h2','答え合わせ');Q.forEach((q,j)=>{el('div',(j+1)+'. '+q[0]+' '+(ans[j]===q[3]?'○':'×')+'　あなたの回答：'+q[ans[j]+1]+' ／ 正解：'+q[q[3]+1],'review '+(ans[j]===q[3]?'ok':'ng'))});el('button','もう一度挑戦する').onclick=start}start();</script></html>
