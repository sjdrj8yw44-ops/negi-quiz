<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ねぎちゃん理解度テスト</title><style>*{box-sizing:border-box}body{background:#101010;color:#eee;font-family:system-ui,sans-serif;margin:0}main{max-width:560px;margin:auto;padding:40px 22px}small{letter-spacing:.2em;color:#aaa}h1{font-size:36px;line-height:1.2}h2{font-size:24px;line-height:1.5}button,input{font:inherit;width:100%;padding:17px;border-radius:8px;margin:7px 0;border:1px solid #555}button{background:#242424;color:white;cursor:pointer;text-align:left}button:hover{border-color:#fff}input{background:#191919;color:white} .primary{background:#eee;color:#111;text-align:center;font-weight:bold}progress{width:100%;accent-color:#ddd;height:8px}p{line-height:1.7;color:#bbb}.result{font-size:64px;font-weight:bold}.review{border-bottom:1px solid #444;padding:14px 0}.ok{color:#9edba9}.ng{color:#f2a1a1}</style><main id="app"></main><script>
const Q=[
['私のMBTIは？','ENTP','INTP',0],['飼っている猫は何匹？','3匹','2匹',1],['担当楽器は？','ギター','ベース',0],['バンド名は？','DYMKA','DYMAK',0],['好きなバンドは？','Maroon 5','Bring Me The Horizon',1],['ギターのチューニングは？','Drop D','Drop C',1],['曲作りに使うDAWは？','FL Studio','Logic Pro',0],['好きな音楽は？','メタルコア','レゲエ',0],['猫の名前は？','たれかつときなこ','たれかつとおもち',1],['たれかつは？','オス','メス',0],['おもちは？','オス','メス',1],['たれかつは元々？','元野良猫','ペットショップ出身',0],['抱っこが苦手な猫は？','たれかつ','おもち',1],['苦手な食べ物は？','オートミール','納豆',0],['納豆なら？','大粒','ひきわり',1],['よく飲むお茶は？','コーン茶','ジャスミン茶',0],['コーヒーは？','無糖','加糖',0],['好きな味は？','辛くて酸っぱい','ひたすら甘い味',0],['よく使うファンデのブランドは？','NARS','マキアージュ',1],['愛用の日焼け止めは？','アネッサ','ビオレ',0],['好きな服のブランドは？','Mila Owen','LIZ LISA',0],['持っているブーツは？','UGG','Dr. Martens',1],['住んでいる県は？','群馬県','長野県',1],['生まれた月は？','5月','8月',0],['勤務先は？','法律事務所','会計事務所',0],['仕事でよく扱う案件は？','特許','交通事故',1],['生活リズムは？','朝型','夜型',1],['寒いときに愛用するものは？','電気毛布','湯たんぽ',0],['気になる車は？','ジープ ラングラー','ミニ クーパー',0],['ChatGPTにつけた名前は？','チャピオ','チャピ丸',0]];
let i=0,ans=[],name='';const app=document.getElementById('app');function el(t,s,c){let e=document.createElement(t);e.textContent=s;if(c)e.className=c;app.append(e);return e}function start(){app.replaceChildren();el('small','NEGICHAN / PERSONAL QUIZ');el('h1','ねぎちゃん理解度テスト');el('p','あなたは私のことをどれだけ知っている？ 全30問・二択。');let inp=el('input','');inp.placeholder='ニックネーム（任意）';let b=el('button','START QUIZ →','primary');b.onclick=()=>{name=inp.value;i=0;ans=[];show()}}function show(){app.replaceChildren();el('small','QUESTION '+(i+1)+' / '+Q.length);let p=el('progress','');p.max=Q.length;p.value=i;el('h2',Q[i][0]);[0,1].forEach(a=>{let b=el('button',(a?'B':'A')+'　'+Q[i][a+1]);b.onclick=()=>{ans.push(a);i++;i===Q.length?result():show()}})}function result(){app.replaceChildren();let n=ans.filter((a,j)=>a===Q[j][3]).length;el('small','YOUR RESULT');el('h2',(name?name+' さんの':'あなたの')+'結果');el('div',n+' / '+Q.length,'result');el('p','正答率 '+Math.round(n/Q.length*100)+'%　｜　'+(n===30?'ねぎちゃん博士':n>=24?'かなりの理解者':n>=15?'まだまだ伸びしろあり':'はじめまして？'));let b=el('button','結果をコピー','primary');b.onclick=async()=>{try{await navigator.clipboard.writeText('ねぎちゃん理解度テスト：'+n+'/'+Q.length+'問正解！');b.textContent='コピーしました'}catch{b.textContent='コピーできませんでした'}};el('h2','答え合わせ');Q.forEach((q,j)=>{el('div',(j+1)+'. '+q[0]+' '+(ans[j]===q[3]?'○':'×')+'　あなたの回答：'+q[ans[j]+1]+' ／ 正解：'+q[q[3]+1],'review '+(ans[j]===q[3]?'ok':'ng'))});el('button','もう一度挑戦する').onclick=start}start();</script></html>
