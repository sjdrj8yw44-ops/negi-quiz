<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ねぎちゃん恋愛理解度テスト</title><style>*{box-sizing:border-box}body{background:#101010;color:#eee;font-family:system-ui,sans-serif;margin:0}main{max-width:560px;margin:auto;padding:40px 22px}small{letter-spacing:.2em;color:#aaa}h1{font-size:36px;line-height:1.2}h2{font-size:24px;line-height:1.5}button,input{font:inherit;width:100%;padding:17px;border-radius:8px;margin:7px 0;border:1px solid #555}button{background:#242424;color:white;cursor:pointer;text-align:left}button:hover{border-color:#fff}input{background:#191919;color:white} .primary{background:#eee;color:#111;text-align:center;font-weight:bold}progress{width:100%;accent-color:#ddd;height:8px}p{line-height:1.7;color:#bbb}.result{font-size:64px;font-weight:bold}.review{border-bottom:1px solid #444;padding:14px 0}.ok{color:#9edba9}.ng{color:#f2a1a1}</style><main id="app"></main><script>
const Q=[["好きになるきっかけは？","尊敬","見た目",0],["惹かれるのは？","頭のいい人","運動神経のいい人",0],["好きな人には？","甘えたい","甘えられたい",0],["恋愛で重視するのは？","刺激","信頼",1],["好きな人に意地悪されると？","可愛いと思う","腹が立つ",0],["愛情を感じるのは？","言葉","行動",1],["嫉妬したときは？","隠す","すぐに伝える",0],["好きな人には？","尽くしたい","尽くされたい",0],["嬉しいプレゼントは？","高価なもの","自分のために選んだもの",1],["好きな人の前では？","素直になる","強がる",0],["恋愛中も一人の時間は？","必要","なくても平気",0],["意見が食い違ったら？","相手に合わせる","話し合う",1],["より許せないのは？","嘘","連絡不足",0],["好きな人の弱い一面を見たら？","愛おしくなる","冷める",0],["恋愛において自分は？","理性派","感情派",0],["惹かれる性格は？","穏やかで優しい","少しひねくれていて面白い",1],["理想の関係は？","何でも頼れる関係","お互いに支え合える関係",1],["好きな人とは？","真面目な話もしたい","楽しい話だけしたい",0],["好きな人の欠点は？","直してほしい","欠点も含めて愛おしい",1],["恋愛で追う側と追われる側なら？","追う側","追われる側",0],["デートするなら？","おしゃれな高級店","気楽に話せるお店",0],["好きな人からの連絡は？","頻度が大切","内容が大切",1],["好きな人に言われて嬉しいのは？","可愛い","頼りになる",1],["好きな人のギャップは？","かなり弱い","あまり気にしない",0],["恋愛で大切にしたいのは？","特別な記念日","何気ない日常",1],["喧嘩したら？","原因を解決したい","とりあえず仲直りしたい",0],["好きな人に対する独占欲は？","ある","ほとんどない",1],["好きな人と過ごすなら？","予定を立てて出かける","何もせずのんびりする",1],["好きな人に求めるのは？","完璧さ","人間らしさ",1],["理想の恋愛は？","いつまでもドキドキする関係","いつまでも尊敬し合える関係",1]];
let i=0,ans=[],name='';const app=document.getElementById('app');function el(t,s,c){let e=document.createElement(t);e.textContent=s;if(c)e.className=c;app.append(e);return e}function start(){app.replaceChildren();el('small','NEGICHAN / LOVE QUIZ');el('h1','ねぎちゃん恋愛理解度テスト');el('p','あなたは私の恋愛観をどれだけ理解している？ 全30問・二択。');let inp=el('input','');inp.placeholder='ニックネーム（任意）';let b=el('button','START QUIZ →','primary');b.onclick=()=>{name=inp.value;i=0;ans=[];show()}}function show(){app.replaceChildren();el('small','QUESTION '+(i+1)+' / '+Q.length);let p=el('progress','');p.max=Q.length;p.value=i;el('h2',Q[i][0]);[0,1].forEach(a=>{let b=el('button',(a?'B':'A')+'　'+Q[i][a+1]);b.onclick=()=>{ans.push(a);i++;i===Q.length?result():show()}})}function result(){app.replaceChildren();let n=ans.filter((a,j)=>a===Q[j][3]).length;el('small','YOUR RESULT');el('h2',(name?name+' さんの':'あなたの')+'結果');el('div',n+' / '+Q.length,'result');el('p','正答率 '+Math.round(n/Q.length*100)+'%　｜　'+(n===30?'ねぎちゃん博士':n>=24?'かなりの理解者':n>=15?'まだまだ伸びしろあり':'はじめまして？'));let b=el('button','結果をコピー','primary');b.onclick=async()=>{try{await navigator.clipboard.writeText('ねぎちゃん恋愛理解度テスト：'+n+'/'+Q.length+'問正解！');b.textContent='コピーしました'}catch{b.textContent='コピーできませんでした'}};el('h2','答え合わせ');Q.forEach((q,j)=>{el('div',(j+1)+'. '+q[0]+' '+(ans[j]===q[3]?'○':'×')+'　あなたの回答：'+q[ans[j]+1]+' ／ 正解：'+q[q[3]+1],'review '+(ans[j]===q[3]?'ok':'ng'))});el('button','もう一度挑戦する').onclick=start}start();</script></html>
